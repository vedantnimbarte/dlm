[package]
name = "dlm"
version = "0.4.0"
edition = "2021"
# Verified by the `msrv` CI job, which builds on exactly this toolchain.
#
# Was 1.75, which had silently stopped being true: `clap_lex 1.1.0` arrives
# through clap's unpinned `"4"` requirement and declares `rust-version = "1.85"`
# (it is edition2024, which Cargo could not even parse before 1.85). Raising the
# floor to match strands nobody — 1.75 through 1.84 already could not build dlm,
# manifest claim notwithstanding. That is what an unverified MSRV buys: not
# support for old toolchains, just a promise to users that breaks on contact.
rust-version = "1.85"
description = "dlm (Dynamic LLM) — run massive LLMs on consumer GPUs by dynamically streaming transformer layers in and out of VRAM"
license = "Apache-2.0"

[lib]
name = "dlm"
path = "src/lib.rs"

[[bin]]
name = "dlm"
path = "src/main.rs"

[features]
default = []
# NVIDIA backend: real CUDA runtime FFI (cudaMemGetInfo / cudaHostAlloc page-locked
# pinning). Requires the CUDA toolkit + `cudart` on the link path.
cuda = []
# AMD backend: ROCm/HIP runtime FFI (hipMemGetInfo / hipHostMalloc). Requires ROCm
# + `amdhip64` on the link path. Mutually exclusive with `cuda`.
# Without either feature, the crate builds and runs with a page-aligned host-memory
# fallback so the engine is fully testable off-GPU on any machine.
rocm = []
# GPU compute kernels: compiles src/gpu/kernels.cu with nvcc and enables GpuKernel
# (the device `run_block`). Implies `cuda`; requires the CUDA toolkit (nvcc) at
# build time. `cargo check` type-checks the Rust FFI without nvcc.
cuda-kernels = ["cuda"]
# Same as `cuda-kernels`, but statically links the CUDA runtime (cudart_static)
# into the binary instead of the shared cudart. The toolkit is needed only at
# BUILD time; the resulting binary runs on any machine with just the NVIDIA
# driver — no CUDA toolkit install required. Used for the redistributable
# `-cuda-static` release asset.
cuda-static = ["cuda-kernels"]
# AMD GPU compute kernels: compiles src/gpu/kernels.cu with hipcc and enables the
# device `run_block` on ROCm. Implies `rocm`; requires the ROCm toolkit (hipcc) at
# build time. `cargo check` type-checks the Rust FFI + HIP backend without hipcc.
# The Rust GPU stack is backend-agnostic — the same kernels/orchestration run on
# CUDA or HIP; only the device runtime differs.
rocm-kernels = ["rocm"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
memmap2 = "0.9"
# Pinned when the MSRV was 1.75, as the last release that still built on it.
# That reason is gone — the floor is 1.85 now (see `rust-version`), which prost
# clears comfortably — so this pin is no longer load-bearing and can be relaxed
# to "0.14" whenever someone wants the newer patch releases. Left exact here
# only to keep a formatting-and-CI branch from moving dependency versions.
prost = "=0.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Release binaries (shipped by the install script): stripped + thin-LTO for a
# small download and a faster inference loop.
[profile.release]
strip = true
lto = "thin"
