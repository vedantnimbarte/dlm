name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, for `deny`: a security advisory lands against a dependency without
  # anyone touching this repo, so a push-only audit goes stale the moment the
  # last commit does. The rest of the suite runs too, which is free signal —
  # it catches a dependency bump breaking the build before someone opens a PR
  # into it.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  # Unit + integration tests on both first-class platforms. dlm is pure std, so
  # Windows is not a special case — but it was never actually exercised in CI,
  # and the only OS-specific code (page size, mmap hints, the nvcc host-compiler
  # probe) lives exactly where an untested platform would break.
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose

  # The load-bearing check: run a REAL checkpoint and assert the output means
  # something. Every self-consistency test in the suite (streaming vs resident,
  # GPU vs CPU, speculative vs greedy) stayed green while the engine emitted
  # multilingual token soup, because none of them looked at the content. This
  # job is what makes "the forward pass is correct" a claim CI can defend.
  real-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--retry-all-errors` because a plain `--retry` ignores the ones that
      # actually happen here: a bare `curl -fsSL` failed this required job with
      # "Recv failure: Connection reset by peer", turning a transient reset into
      # a red gate on an unrelated PR. The fixture script has always retried;
      # these two jobs were the ones that did not.
      - name: Fetch a small real checkpoint (Qwen2.5-0.5B-Instruct)
        run: |
          mkdir -p models
          base="https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/resolve/main"
          for f in config.json generation_config.json tokenizer.json model.safetensors; do
            curl -fsSL --retry 5 --retry-all-errors "$base/$f" -o "models/$f"
          done
      - name: Assert the model actually answers correctly
        run: cargo test --release --test real_model -- --nocapture

  # The same load-bearing idea for GPTQ, which needs its own real export: the
  # packing is round-trip testable against dlm's own packer while real exporters
  # differ in ways that corrupt weights *plausibly* — AutoGPTQ stores `zero - 1`,
  # and decoding with the stored zero yields fluent nonsense rather than an error.
  # Only a real checkpoint that must still answer correctly catches that.
  gptq-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch a small real GPTQ checkpoint (Qwen2.5-0.5B-Instruct-GPTQ-Int4)
        run: |
          dir=models/Qwen2.5-0.5B-GPTQ
          mkdir -p "$dir"
          base="https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int4/resolve/main"
          for f in config.json generation_config.json tokenizer.json model.safetensors; do
            curl -fsSL --retry 5 --retry-all-errors "$base/$f" -o "$dir/$f"
          done
      # The test skips (rather than fails) when the fixture is missing, so that a
      # fresh clone still runs the suite. In CI that would turn a broken download
      # into a green run that tested nothing — so require the fixture here.
      - name: Require the fixture (a silent skip would prove nothing)
        run: |
          test -s models/Qwen2.5-0.5B-GPTQ/config.json
          test -s models/Qwen2.5-0.5B-GPTQ/model.safetensors
          test -s models/Qwen2.5-0.5B-GPTQ/tokenizer.json
      - name: Assert the GPTQ export still decodes to weights that mean something
        run: cargo test --release --test gptq_model -- --nocapture

  # One real `config.json` + `tokenizer.json` per model family.
  #
  # `real-model` above proves the engine is right, but only for the one shape it
  # loads: Qwen — dense, byte-level BPE, no BOS. Every defect found before 0.3.0
  # hid in exactly the space that leaves uncovered — a Gemma2 config that would
  # not parse, SentencePiece vocabularies encoded with byte-level rules, an
  # expert count DeepSeek spells differently — and all of them lived in these two
  # files, which the in-code fixtures never touch. A green suite said nothing
  # about a family whose checkpoint nobody had loaded.
  #
  # No weights: these are parsing defects, and a tokenizer that picks the wrong
  # pieces yields the wrong ids whatever the weights are. ~85 MB, and every
  # source is ungated, so this runs on fork PRs too.
  family-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch one config + tokenizer per family
        run: sh .github/fetch-family-fixtures.sh models/fixtures
      # Each test skips when its directory is absent so a fresh clone still runs
      # the suite; in CI that would turn a broken download into a green run that
      # checked nothing, so require every fixture explicitly.
      - name: Require every fixture (a silent skip would prove nothing)
        run: |
          for f in gemma-2 llama-2 mistral deepseek-v2 qwen2.5 \
                   llama-3 gemma-1 gemma-3 gemma-3-270m gemma-3-4b qwen3 qwen2-moe mixtral phi-3 gpt2 falcon; do
            test -s "models/fixtures/$f/config.json"
            test -s "models/fixtures/$f/tokenizer.json"
          done
      - name: Assert each family parses and tokenizes as its checkpoint says
        run: cargo test --release --test family_fixtures -- --nocapture

  # Type-check the GPU FFI without a GPU. Neither nvcc nor hipcc is present here,
  # so build.rs skips device-code compilation — `cargo check` still validates the
  # Rust side of the kernel signatures, which is what silently drifted before
  # (two `extern` blocks declaring `dlm_decode_block` with different ABIs).
  #
  # Both vendors, because the drift this catches is per-backend: the HIP path was
  # never built by CI at all, so `src/gpu/ffi_hip.rs` could break in exactly the
  # way this job exists to prevent and no push would have noticed.
  #
  # `-D warnings`, because a feature-gated build is where dead code accumulates:
  # arms that exist only on the *other* side of a `cfg` stop being compiled and
  # nothing complains. This job ran for months emitting an unheeded "function
  # `gpu_compute_unavailable` is never used".
  gpu-ffi-check:
    strategy:
      fail-fast: false
      matrix:
        feature: [cuda-kernels, rocm-kernels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check ${{ matrix.feature }} FFI
        run: cargo check --features ${{ matrix.feature }} --all-targets
        env:
          RUSTFLAGS: -D warnings

  # Build on the exact toolchain `rust-version` in Cargo.toml promises.
  #
  # Nothing checked this before, and by the time it was checked the claim had
  # already gone stale: the manifest said 1.75 while `clap_lex 1.1.0` — pulled in
  # by clap's unpinned `"4"` — needs 1.85 to so much as parse. A transitive bump
  # is all it takes, which is why this cannot be a thing anyone remembers to do.
  #
  # `--locked` on purpose: without it Cargo resolves fresh versions and the job
  # tests a dependency set no user has, passing or failing for reasons unrelated
  # to the commit. Pin the toolchain explicitly rather than tracking a moving
  # target, so this fails when *dlm* raises its floor, not when Rust ships.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Check on the declared MSRV
        run: cargo check --locked --all-targets

  # Audit the locked dependency graph: known advisories, license compatibility,
  # unexpected sources.
  #
  # Only meaningful since `Cargo.lock` was committed — an unlocked graph has no
  # fixed set of versions to audit, which is why this job did not exist before.
  # Advisories appear without anyone touching the repo, so this must run on a
  # schedule as well as on push; a clean audit last Tuesday says nothing today.
  #
  # Deliberately NOT in the `test` aggregate below, so it reports without
  # gating. A new advisory in a transitive dependency is not something a PR
  # author can fix, and wedging every unrelated PR until someone does is how a
  # useful signal gets muted. It is loud, visible, and non-blocking.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check advisories, licenses and sources
        run: cargo deny --all-features check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The `rustfmt` component above was installed but never invoked, so the
      # only formatting rule the project enforced was whatever each patch
      # arrived with. Runs before clippy: it is the faster of the two and needs
      # no build, so a formatting-only failure reports in seconds.
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # Single aggregate gate. `main`'s branch protection requires a status check
  # named exactly `test`; a matrix job reports as `test (ubuntu-latest)` etc., so
  # without this the required context would never appear and every PR would wedge.
  # Depending on all legs also means the one required check now gates the whole
  # suite rather than a single Linux run.
  test:
    if: always()
    needs:
      [
        test-matrix,
        real-model,
        gptq-model,
        family-fixtures,
        gpu-ffi-check,
        msrv,
        lint,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "a required job failed"; exit 1; }
          done
          echo "all required jobs passed"
